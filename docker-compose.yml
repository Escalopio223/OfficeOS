version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: oogleos-postgres
    restart: always
    environment:
      POSTGRES_USER: oogle_user
      POSTGRES_PASSWORD: oogle_pass
      POSTGRES_DB: oogleos_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oogle_user -d oogleos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oogleos-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
