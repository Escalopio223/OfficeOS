<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 425" width="500" height="425" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Pestañas -->
  <rect x="400" y="68" width="70" height="80" rx="18" fill="#4285F4"/>
  <rect x="400" y="166" width="70" height="80" rx="18" fill="#FBBC04"/>
  <rect x="400" y="264" width="70" height="80" rx="18" fill="#EA4335"/>

  <!-- Página -->
  <rect x="268" y="35" width="177" height="360" rx="28" fill="#F8F9FC" filter="url(#soft)"/>

  <!-- Lienzo -->
  <rect x="303" y="88" width="122" height="252" rx="16" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2"/>

  <!-- Pinceladas -->
  <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M324 132q18-26 36 0t36 0" stroke="#EA4335"/>
    <path d="M324 164q18-26 36 0t36 0" stroke="#FBBC04"/>
    <path d="M324 196q18-26 36 0t36 0" stroke="#34A853"/>
    <path d="M322 232q18-26 36 0" stroke="#4285F4"/>
  </g>

  <!-- Gotas de pintura en el lienzo -->
  <circle cx="394" cy="236" r="7" fill="#4285F4"/>
  <circle cx="404" cy="214" r="4" fill="#EA4335"/>

  <!-- Rastro del pincel -->
  <path d="M320 316q14-16 30-6" fill="none" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round"/>

  <!-- Pincel -->
  <g transform="translate(374 280) rotate(35)">
    <rect x="-6" y="-44" width="12" height="50" rx="6" fill="#475569"/>
    <rect x="-8" y="2" width="16" height="18" rx="3" fill="#CBD5E1"/>
    <rect x="-8" y="8" width="16" height="3" fill="#94A3B8"/>
    <path d="M-8 20H8C8 32 3 40 0 44C-3 40-8 32-8 20Z" fill="url(#bristles)"/>
  </g>

  <!-- Portada -->
  <g filter="url(#shadow)">
    <polygon points="45,68 278,22 278,403 45,365" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="20" stroke-linejoin="round"/>
  </g>

  <!-- Letra O (hueco real, deja ver la portada) -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M91 214a70 98 0 1 0 140 0a70 98 0 1 0-140 0ZM132 214a29 49 0 1 0 58 0a29 49 0 1 0-58 0Z"/>
</svg>
