<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Gradiente de la pestaña trasera pulida -->
    <linearGradient id="tabBackGrad" x1="20" y1="18" x2="65" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Bisel de luz superior de la pestaña trasera -->
    <linearGradient id="tabEdgeLight" x1="20" y1="18" x2="65" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.2" />
    </linearGradient>

    <!-- Interior en sombra/cavidad de la carpeta -->
    <linearGradient id="cavityGrad" x1="64" y1="28" x2="64" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Sombra para las tarjetas de contenido -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Sombra de la solapa frontal sobre el conjunto -->
    <filter id="frontFlapShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Gradiente cuerpo frontal clásico -->
    <linearGradient id="frontFlapGrad" x1="16" y1="44" x2="112" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Gradiente de tarjetas -->
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="redCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="yellowCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. FONDO TRASERO PULIDO ==================== -->
  <!-- Silueta posterior de la carpeta -->
  <path
    d="M 20 28
       C 20 22.5 24.5 18 30 18
       L 52 18
       C 56 18 59.8 20.2 61.8 23.8
       L 66 31
       L 102 31
       C 107.5 31 112 35.5 112 41
       L 112 70
       L 16 70
       L 16 32
       C 16 29.8 17.8 28 20 28 Z"
    fill="url(#tabBackGrad)"
  />

  <!-- Línea de luz superior en la pestaña trasera -->
  <path
    d="M 21 28
       C 21 23 25 19 30 19
       L 52 19
       C 55.7 19 59.2 21 61.1 24.5
       L 65.5 32
       L 102 32
       C 106.5 32 110.5 35.5 111 40"
    stroke="url(#tabEdgeLight)"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Cavidad oscura interior (da profundidad detrás de las tarjetas) -->
  <rect x="18" y="32" width="92" height="28" rx="4" fill="url(#cavityGrad)" />

  <!-- ==================== 2. TARJETAS INTERIORES (ROJO, AZUL, AMARILLO) ==================== -->
  
  <!-- TARJETA ROJA (Izquierda inclinada) -->
  <g transform="rotate(-8 32 26)" filter="url(#cardShadow)">
    <rect x="28" y="24" width="34" height="48" rx="5" fill="url(#redCardGrad)" />
    <!-- Líneas sutiles de contenido -->
    <rect x="33" y="32" width="18" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.65" />
    <rect x="33" y="38" width="24" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.45" />
    <rect x="33" y="44" width="14" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.45" />
  </g>

  <!-- TARJETA AMARILLA (Derecha inclinada) -->
  <g transform="rotate(8 68 26)" filter="url(#cardShadow)">
    <rect x="66" y="24" width="34" height="48" rx="5" fill="url(#yellowCardGrad)" />
    <!-- Líneas sutiles de contenido -->
    <rect x="71" y="32" width="16" height="2.5" rx="1.2" fill="#78350F" opacity="0.5" />
    <rect x="71" y="38" width="24" height="2.5" rx="1.2" fill="#78350F" opacity="0.35" />
    <rect x="71" y="44" width="20" height="2.5" rx="1.2" fill="#78350F" opacity="0.35" />
  </g>

  <!-- TARJETA AZUL (Centro dominante, más alta) -->
  <g filter="url(#cardShadow)">
    <rect x="47" y="19" width="34" height="54" rx="5" fill="url(#blueCardGrad)" />
    <!-- Esquina superior doblada (fold clip) -->
    <path d="M 73 19 L 81 27 L 73 27 Z" fill="#1D4ED8" />
    <path d="M 73 19 L 81 27 L 73 27 Z" stroke="#93C5FD" stroke-width="0.8" />
    <!-- Líneas de documento simuladas -->
    <rect x="52" y="28" width="16" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.85" />
    <rect x="52" y="34" width="24" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.55" />
    <rect x="52" y="40" width="24" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.55" />
    <rect x="52" y="46" width="18" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- ==================== 3. CUERPO FRONTAL CLÁSICO ==================== -->
  <!-- Solapa principal -->
  <rect
    x="16"
    y="44"
    width="96"
    height="64"
    rx="12"
    fill="url(#frontFlapGrad)"
    filter="url(#frontFlapShadow)"
  />

  <!-- Borde de luz superior (efecto relieve/bisel de plástico pulido) -->
  <path
    d="M 18 52
       C 18 47.5 21.5 45 26 45
       L 102 45
       C 106.5 45 110 47.5 110 52"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Sombra de bisel inferior de la carpeta -->
  <path
    d="M 22 107
       L 106 107
       C 110 107 112 105 112 102
       C 112 105 109 108 105 108
       L 23 108
       C 19 108 16 105 16 102
       C 16 105 18 107 22 107 Z"
    fill="#A16207"
  />
</svg>
